<div class="app flex flex-col">

<div class="workspace"><section class="menu-paper"><header class="menu-head"><div><h1 id="category-title">火锅底</h1><p id="category-description">先选一口好锅。</p></div><span id="menu-count" class="menu-count">3 款</span></header><main class="menu-scroll" id="menu-scroll" tabindex="-1"><div id="menu-list"></div><p class="menu-footnote">好吃的慢慢选，想吃的随时加。</p></main></section><nav class="rail" id="category-rail" aria-label="点单分类"></nav><aside class="order-aside" aria-label="这桌已选"><h2>这桌已选</h2><p class="aside-note">06 桌 · <span data-diner-count>2</span> 位</p><div id="aside-lines" class="aside-lines"></div><div class="order-total-row"><span>合计</span><b data-total class="num">¥0</b></div><button class="primary" id="aside-submit" data-action="submit" disabled>确认菜品</button></aside></div>

function preparePhoto(img,item,force=false){
 if(!img||!item)return;img.alt=item.name;const box=img.closest('.photo-button')||img.parentElement;
 let usedFallback=false,retried=false;
 img.onload=()=>{img.hidden=false;box?.removeAttribute('data-image-state');if(box?.classList.contains('photo-button'))box.setAttribute('aria-label','查看'+item.name)};
 img.onerror=()=>{
  if(item.fallbackPhoto&&!usedFallback){usedFallback=true;img.src=item.fallbackPhoto;return}
  if(!retried){retried=true;const retry=new URL(usedFallback?item.fallbackPhoto:item.photo,location.href);retry.searchParams.set('retry',String(Date.now()));img.src=retry.href;return}
  if(box?.classList.contains('photo-button')){box.dataset.imageState='error';img.hidden=true;box.setAttribute('aria-label',item.name+'图片暂未显示，点击重试')}
 };
 if(force){img.hidden=false;box?.removeAttribute('data-image-state');const retry=new URL(item.photo,location.href);retry.searchParams.set('retry',String(Date.now()));img.src=retry.href}
 else if(img.getAttribute('src')!==item.photo)img.src=item.photo;
 else if(img.complete){if(img.naturalWidth)img.onload();else img.onerror()}
}
function hydrate(root){root.querySelectorAll('[data-photo]').forEach(img=>preparePhoto(img,byId(img.dataset.photo)))}
function makeNav(){
 $('#category-rail').innerHTML=TREE.map((group,index)=>{const groupId='nav-children-'+index;return group.children?`<div class="nav-group"><button class="nav-button" data-action="toggle-group" data-category="${group.label}" aria-expanded="false" aria-controls="${groupId}"><span>${group.label}</span><span class="chevron">${icon('chevron-down',12)}</span></button><div id="${groupId}" class="nav-children" inert aria-hidden="true"><div>${group.children.map(child=>`<button class="nav-button child" data-action="category" data-category="${child}">${child}</button>`).join('')}</div></div></div>`:`${index===TREE.length-2?'<div class="rail-separator"></div>':''}<button class="nav-button" data-action="category" data-category="${group.label}">${group.label}</button>`}).join('');
}
function renderNav(){
 $('#category-rail').querySelectorAll('[data-category]').forEach(button=>{
  const label=button.dataset.category,group=TREE.find(group=>group.label===label),isParent=!!group?.children;
  button.classList.toggle('active',label===active&&!isParent);button.setAttribute('aria-current',label===active?'true':'false');
  if(isParent){const expanded=openGroup===label,selected=active===label||group.children.includes(active);button.setAttribute('aria-expanded',String(expanded));button.classList.toggle('parent-selected',selected);const panel=document.getElementById(button.getAttribute('aria-controls'));panel.classList.toggle('open',expanded);panel.inert=!expanded;panel.setAttribute('aria-hidden',String(!expanded))}

function menuQuantity(item){return cart.filter(line=>line.id===item.id).reduce((sum,line)=>sum+line.qty,0)}

function renderMenu(){
 const filtered=MENU.filter(item=>(active==='全部'||item.major===active||item.cat===active||(active==='火锅底'&&item.major==='锅底'))&&(!search||[item.name,item.cat,item.major].join(' ').toLowerCase().includes(search.toLowerCase())));

 $('#menu-list').innerHTML=filtered.length?filtered.map((item,index)=>{const customizable=item.major==='锅底'||choices(item).length>0;const quantity=menuQuantity(item);return `<article class="menu-item ${item.major==='酒水'?'drink-item':''} ${item.soldout?'sold-out':''}" data-item="${item.id}"><button class="photo-button" data-action="detail" data-id="${item.id}" aria-label="查看${item.name}"><img src="${item.photo}" data-photo="${item.id}" alt="${item.name}" width="132" height="140" loading="${index<3?'eager':'lazy'}" fetchpriority="${index===0?'high':'auto'}" decoding="async"></button><div class="dish-content"><button class="dish-name" data-action="detail" data-id="${item.id}">${item.name}</button>${item.major==='限定'?'<span class="stamp">当季限定</span>':''}<p class="dish-desc">${item.desc}</p><div class="dish-action"><span class="price"><small>¥</small>${item.price}<span class="unit"> /${item.unit}</span></span>${item.soldout?'<span class="sold-out-label">已售罄</span>':customizable?`<button class="choose-button" data-action="detail" data-id="${item.id}">${quantity?'已选 '+quantity+' · 再选':'选口味'}</button>`:quantityControls(lineKey(item.id),quantity,item.name)}</div></div></article>`}).join(''):'<div class="empty-menu">没找到这道菜。<br>换个词，或看看全部菜单。<br><button class="text-button" data-action="reset-search">清空搜索</button></div>';

 if(!origin||reduced||innerWidth>=768)return;const target=bag.getBoundingClientRect();if(!origin.rect.width||!target.width)return;
 const img=document.createElement('img');img.className='flying-photo';img.src=origin.url;img.style.left=origin.rect.left+'px';img.style.top=origin.rect.top+'px';img.style.width=origin.rect.width+'px';img.style.height=origin.rect.height+'px';img.setAttribute('aria-hidden','true');document.body.appendChild(img);

 const animation=img.animate([{transform:'translate(0,0) scale(.9)',opacity:.9},{transform:`translate(${dx}px,${dy}px) scale(.12)`,opacity:.15}],{duration:520,easing:'cubic-bezier(.3,0,.2,1)'});animation.onfinish=()=>img.remove();

function addItem(item,option='',quantity=1,origin=null){const key=lineKey(item.id,option),line=findLine(key);if(line)line.qty=Math.min(99,line.qty+quantity);else cart.push({id:item.id,option,qty:quantity});orderConfirmation=null;renderMenu();renderCart();flyToCart(origin);announce('已加入 '+item.name+(option?' · '+option:''))}
function openDetail(item,trigger,key=null,fromCart=false){
 detail=item;detailTrigger=trigger;editingKey=key;returnToCart=fromCart;const existing=key?findLine(key):null;detailQty=existing?.qty||1;detailOption=existing?.option||choices(item)[item.spicy?1:0]||'';preparePhoto($('#detail-photo'),item);$('#detail-title').textContent=item.name;$('#detail-price').innerHTML='<small>¥</small>'+item.price+'<span class="unit"> /'+item.unit+'</span>';$('#detail-description').textContent=item.desc;const options=choices(item);$('#detail-options-wrap').hidden=!options.length;$('#detail-option-label').textContent=item.spicy?'选个辣度':'怎么喝';renderDetailOptions();renderDetailQuantity();$('#detail-sheet').showModal();
}
function renderDetailOptions(){$('#detail-options').innerHTML=choices(detail).map(option=>`<button class="option" role="radio" aria-checked="${option===detailOption}" data-action="detail-option" data-option="${option}">${option===detailOption?icon('check',12)+' ':''}${option}</button>`).join('')}
function renderDetailQuantity(){$('#detail-quantity').textContent=detailQty;$('#detail-subtotal').textContent='¥'+detail.price*detailQty;document.querySelector('[data-action="detail-minus"]').disabled=detailQty<=1;document.querySelector('[data-action="detail-plus"]').disabled=detailQty>=99;const add=document.querySelector('[data-action="confirm-detail"]');add.disabled=!!detail.soldout;add.firstElementChild.textContent=detail.soldout?'已售罄，看看别的菜吧':editingKey?'保存修改':detail.major==='锅底'?'就选这锅':detail.major==='酒水'?'就选这杯':'就选这道'}
function closeDetail(){const goBack=returnToCart;$('#detail-sheet').close();editingKey=null;returnToCart=false;if(goBack)showCart();else if(detailTrigger?.isConnected)detailTrigger.focus({preventScroll:true})}
function showCart(){orderConfirmation=null;renderCartSheet();$('#cart-sheet').showModal()}
function confirmSelection(){if(!cart.length)return;orderConfirmation={count:qtyTotal(),total:amountTotal()};renderMenu();renderCart();if(!$('#cart-sheet').open)$('#cart-sheet').showModal()}
document.addEventListener('click',event=>{
 const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;
 if(action==='welcome'){$('#welcome-sheet').showModal()}
 if(action==='diners-minus'){diners=Math.max(1,diners-1);syncDiners()}
 if(action==='diners-plus'){diners=Math.min(20,diners+1);syncDiners()}
 if(action==='start-ordering')startOrdering();
 if(action==='toggle-group'){const label=button.dataset.category,opening=openGroup!==label;openGroup=opening?label:null;if(opening){active=label;search='';$('#search-input').value='';$('#menu-scroll').scrollTop=0;renderMenu()}renderNav()}
 if(action==='category')setCategory(button.dataset.category);
 if(action==='detail'){if(button.dataset.imageState==='error')preparePhoto(button.querySelector('img'),byId(button.dataset.id),true);else openDetail(byId(button.dataset.id),button)}
 if(action==='close-detail')closeDetail();
 if(action==='edit-line'){const line=findLine(button.dataset.key);if(line){const fromCart=$('#cart-sheet').open;$('#cart-sheet').close();openDetail(byId(line.id),button,button.dataset.key,fromCart)}}
 if(action==='detail-option'){detailOption=button.dataset.option;renderDetailOptions();$('#detail-options').querySelector(`[data-option="${detailOption}"]`)?.focus({preventScroll:true})}
 if(action==='detail-minus'){detailQty=Math.max(1,detailQty-1);renderDetailQuantity()}
 if(action==='detail-plus'){detailQty=Math.min(99,detailQty+1);renderDetailQuantity()}
 if(action==='confirm-detail'){const origin={rect:$('#detail-photo').getBoundingClientRect(),url:$('#detail-photo').src};const updating=editingKey,goBack=returnToCart;$('#detail-sheet').close();if(updating)cart=cart.filter(line=>lineKey(line.id,line.option)!==updating);addItem(detail,detailOption,detailQty,updating?null:origin);if(updating)announce('已改好 '+detail.name);editingKey=null;returnToCart=false;if(goBack)showCart()}
 if(action==='increase'){const key=button.dataset.key,[id,option]=key.split('|'),item=byId(id);if(item&&!item.soldout)addItem(item,option||'',1,originFor(button))}
 if(action==='decrease'){const line=findLine(button.dataset.key);if(line){line.qty--;if(!line.qty)cart=cart.filter(other=>other!==line);renderMenu();renderCart()}}
 if(action==='cart')showCart();
 if(action==='cart-primary'){if(cart.length)showCart();else setCategory('火锅底')}
 if(action==='close-cart')$('#cart-sheet').close();
 if(action==='jump-pot'){$('#cart-sheet').close();setCategory('火锅底')}
 if(action==='clear-cart'){cart=[];renderMenu();renderCart()}
 if(action==='submit')confirmSelection();
 if(action==='continue'){$('#cart-sheet').close();orderConfirmation=null;setCategory('火锅底')}
 if(action==='search'){$('#search-panel').hidden=!$('#search-panel').hidden;if(!$('#search-panel').hidden)$('#search-input').focus()}
 if(action==='cancel-search'){$('#search-panel').hidden=true;search='';$('#search-input').value='';setCategory('火锅底')}
 if(action==='reset-search'){search='';$('#search-input').value='';renderMenu();$('#search-input').focus()}
});
$('#search-input').addEventListener('input',event=>{search=event.target.value;active='全部';openGroup=null;renderNav();renderMenu();$('#menu-scroll').scrollTop=0});
for(const selector of ['#detail-sheet','#cart-sheet'])$(selector).addEventListener('click',event=>{if(event.target!==event.currentTarget)return;const rect=event.currentTarget.getBoundingClientRect();if(event.clientY<rect.top||event.clientX<rect.left||event.clientX>rect.right)event.currentTarget.close()});
$('#detail-sheet').addEventListener('cancel',event=>{event.preventDefault();closeDetail()});
makeNav();render();syncDiners();
$('#welcome-sheet').addEventListener('cancel',event=>{event.preventDefault();startOrdering()});
let arrived=false;try{arrived=sessionStorage.getItem('guobar.arrival.v1')==='seen'}catch{}
if(!arrived)$('#welcome-sheet').showModal();
</script>
</div>
</body></html>
